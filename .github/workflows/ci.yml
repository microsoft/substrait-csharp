name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PREVIEW_PACKAGE_VERSION: 0.1.0-preview.${{ github.run_number }}

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Substrait.sln

      - name: Verify formatting
        run: dotnet format Substrait.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Substrait.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Substrait.sln --configuration Release --no-build --logger trx

      - name: Pack
        run: dotnet pack src/Substrait/Substrait.csproj --configuration Release --no-build --output artifacts/packages -p:PackageVersion=${{ env.PREVIEW_PACKAGE_VERSION }}

      - name: Validate packages
        shell: pwsh
        run: >-
          ./eng/Validate-Package.ps1
          -PackagePath artifacts/packages/Microsoft.Substrait.${{ env.PREVIEW_PACKAGE_VERSION }}.nupkg
          -SymbolsPackagePath artifacts/packages/Microsoft.Substrait.${{ env.PREVIEW_PACKAGE_VERSION }}.snupkg
          -ExpectedVersion ${{ env.PREVIEW_PACKAGE_VERSION }}

      - name: Restore SBOM tool
        run: dotnet tool restore

      - name: Generate SBOM
        run: >-
          dotnet tool run sbom-tool generate
          -b artifacts/packages
          -bc src/Substrait
          -pn Microsoft.Substrait
          -pv ${{ env.PREVIEW_PACKAGE_VERSION }}
          -ps "Organization: Microsoft"
          -nsb https://github.com/microsoft/substrait-csharp
          -mi SPDX:2.2

      - name: Validate SBOM
        run: >-
          dotnet tool run sbom-tool validate
          -b artifacts/packages
          -o artifacts/sbom-validation.json
          -mi SPDX:2.2

      - name: Restore package smoke test
        run: dotnet restore tests/PackageSmokeTest/PackageSmokeTest.csproj -p:SmokeTestPackageVersion=${{ env.PREVIEW_PACKAGE_VERSION }} --configfile tests/PackageSmokeTest/NuGet.Config --no-cache

      - name: Run package smoke test
        run: dotnet run --project tests/PackageSmokeTest/PackageSmokeTest.csproj --configuration Release --no-restore -p:SmokeTestPackageVersion=${{ env.PREVIEW_PACKAGE_VERSION }}

      - name: Restore .NET Framework package smoke test
        if: runner.os == 'Windows'
        run: dotnet restore tests/PackageSmokeTest/PackageSmokeTest.csproj -p:SmokeTestPackageVersion=${{ env.PREVIEW_PACKAGE_VERSION }} -p:SmokeTestTargetFramework=net462 --configfile tests/PackageSmokeTest/NuGet.Config --no-cache

      - name: Run .NET Framework package smoke test
        if: runner.os == 'Windows'
        run: dotnet run --project tests/PackageSmokeTest/PackageSmokeTest.csproj --configuration Release --no-restore -p:SmokeTestPackageVersion=${{ env.PREVIEW_PACKAGE_VERSION }} -p:SmokeTestTargetFramework=net462

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ runner.os }}
          path: |
            artifacts/packages/*.*nupkg
            artifacts/packages/_manifest/spdx_2.2/manifest.spdx.json
          if-no-files-found: error